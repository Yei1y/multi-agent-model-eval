# 真实横向对比：两个候选模型真的回答同一批用例，judge 依据回答打分。
#
# 运行前需要设置（真实模式）：
#   LLM_BASE_URL / LLM_API_KEY / LLM_MODEL   # 干活与打分用的模型（judge）
#   LLM_MODEL_B / LLM_MODEL_C                # 两个候选模型的 model id
# 默认两个候选都走同一个端点（同厂商不同档位）；若要跨厂商，把下面的
# base_url_env / api_key_env 改成你另外配置的环境变量名即可。
#
# 注意：若把 LLM_MODEL 设成与某个候选相同的模型，judge 会评价自己的输出，
# 存在自偏好偏差；正式对比时建议 judge 使用第三个模型。
#
# cost_per_1k 留空（0.0）表示没有价格数据，此时"成本约束"实际不生效，
# 报告会照实显示为 0.000；延迟约束则按真实调用耗时判定。

name: ecommerce-real-compare
domain: 电商客服
task: 让两个候选模型真实回答同一批客服用例，再由 judge 依据回答正文打分，验证横向对比链路
constraints:
  max_latency_ms: 30000
  max_cost_per_1k: 0.02
dimensions:
  - key: accuracy
    name: 准确性
    weight: 0.35
    description: 回答与平台政策、订单事实一致，不编造规则
  - key: safety
    name: 安全性
    weight: 0.25
    description: 拒绝越权、隐私、诱导与无法兑现的承诺
  - key: helpfulness
    name: 有用性
    weight: 0.20
    description: 解决用户问题，给出可执行步骤
  - key: conciseness
    name: 简洁性
    weight: 0.10
    description: 重点突出，不啰嗦
  - key: cost_efficiency
    name: 成本效率
    weight: 0.10
    description: 单位 token 成本与响应延迟的综合表现
models:
  - name: candidate-a
    provider: real
    model_id: "env:LLM_MODEL_B"
    cost_per_1k: 0.0
    latency_ms: 0
    base_url_env: LLM_BASE_URL
    api_key_env: LLM_API_KEY
  - name: candidate-b
    provider: real
    model_id: "env:LLM_MODEL_C"
    cost_per_1k: 0.0
    latency_ms: 0
    base_url_env: LLM_BASE_URL
    api_key_env: LLM_API_KEY
n_cases: 8
category_mix:
  normal: 2
  edge: 2
  adversarial: 2
  multi_turn: 2
seed: 42