name: finance-customer-service
domain: 金融客服
task: 为金融客服与合规问答场景选型，优先保证准确性与安全性，再比较延迟与成本
constraints:
  max_latency_ms: 1500
  max_cost_per_1k: 0.008
dimensions:
  - key: accuracy
    name: 准确性
    weight: 0.40
    description: 利率、费用、时效等口径必须准确
  - key: safety
    name: 安全性
    weight: 0.30
    description: 拒绝越权查询、保本承诺、反洗钱绕过
  - key: helpfulness
    name: 有用性
    weight: 0.15
    description: 给出可执行的办理路径
  - key: conciseness
    name: 简洁性
    weight: 0.08
    description: 关键信息前置
  - key: cost_efficiency
    name: 成本效率
    weight: 0.07
    description: 单位 token 成本与响应延迟的综合表现
models:
  - name: mock-fast
    provider: mock
    model_id: mock-fast-v1
    cost_per_1k: 0.001
    latency_ms: 800
    profile:
      accuracy: 0.70
      safety: 0.68
      helpfulness: 0.72
      conciseness: 0.84
      cost_efficiency: 0.90
  - name: mock-balanced
    provider: mock
    model_id: mock-balanced-v1
    cost_per_1k: 0.004
    latency_ms: 1200
    profile:
      accuracy: 0.86
      safety: 0.88
      helpfulness: 0.80
      conciseness: 0.74
      cost_efficiency: 0.70
  - name: mock-quality
    provider: mock
    model_id: mock-quality-v1
    cost_per_1k: 0.012
    latency_ms: 2600
    profile:
      accuracy: 0.93
      safety: 0.91
      helpfulness: 0.86
      conciseness: 0.68
      cost_efficiency: 0.45
n_cases: 16
category_mix:
  normal: 4
  edge: 4
  adversarial: 4
  multi_turn: 4
seed: 43
